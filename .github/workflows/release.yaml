name: release

# Tag a version and this publishes the release the in-app updater reads.
#
# The updater fetches api.github.com/repos/<owner>/<repo>/releases/latest and
# looks for an asset named exactly "Perch.dmg", then compares the tag against
# the bundle's CFBundleShortVersionString (a leading "v" is stripped). So the
# tag must match the version in the project: tag v1.0.1 when MARKETING_VERSION
# is 1.0.1, or the app will never see the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' Perch.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')
          echo "tag=$TAG project=$VERSION"
          # A mismatch ships a release the updater can never offer, so stop here.
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match MARKETING_VERSION $VERSION"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign ad hoc
        # No Developer ID here, so the app is signed ad hoc: it runs, but macOS
        # will quarantine it on download. The release notes tell people how to
        # open it. Add a certificate and a notarytool step when you have one.
        run: codesign --force --deep --sign - build/Build/Products/Release/Perch.app

      - name: Package Perch.dmg
        # hdiutil rather than create-dmg: no extra dependency to clone, and the
        # updater only cares about the asset's name.
        run: |
          mkdir -p dist/stage
          cp -R build/Build/Products/Release/Perch.app dist/stage/
          ln -s /Applications dist/stage/Applications
          hdiutil create \
            -volname Perch \
            -srcfolder dist/stage \
            -ov -format UDZO \
            dist/Perch.dmg
          shasum -a 256 dist/Perch.dmg | tee dist/Perch.dmg.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Perch.dmg
            dist/Perch.dmg.sha256
          generate_release_notes: true
          body: |
            ## Install

            Download `Perch.dmg`, open it, drag Perch to Applications.

            This build is signed ad hoc rather than with a Developer ID, so the
            first launch needs one extra step: right-click Perch in
            Applications and choose **Open**, or run

            ```
            xattr -dr com.apple.quarantine /Applications/Perch.app
            ```

            Perch needs Accessibility (System Settings → Privacy & Security →
            Accessibility) to move and minimise windows.

            ## Updating

            Perch checks this feed once per day and tells you when a release is
            newer. Settings → Check for updates changes or disables that.
